<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Energialabra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0b10;--card:#15151c;--card2:#1c1c25;--card3:#262631;
  --text:#f0eff5;--dim:#9a97a8;--faint:#6d6a7a;--line:rgba(255,255,255,.07);
  --acc:#d4ff3f;--acc-ink:#141a02;
  --gold:#ffc53d;--silver:#cfd3dc;--bronze:#e08a54;
  --bad:#ff5f7e;--mid:#ffa93d;--good:#9fe04a;--top:#4be0c0;
  --r:16px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);line-height:1.5;
  font-family:"Space Grotesk",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
::selection{background:var(--acc);color:var(--acc-ink)}
.hide{display:none!important}
.num{font-variant-numeric:tabular-nums}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:30;background:rgba(11,11,16,.92);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top-in{max-width:960px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.logo{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.mark{width:34px;height:34px;border-radius:10px;background:var(--acc);display:grid;place-items:center;flex:0 0 auto}
.mark svg{width:19px;height:19px;color:var(--acc-ink)}
.logo h1{margin:0;font-size:17px;font-weight:700;letter-spacing:-.3px;line-height:1.1}
.logo p{margin:2px 0 0;font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--faint)}
.tbtn{width:42px;height:42px;border-radius:12px;background:var(--card2);border:1px solid var(--line);
  display:grid;place-items:center;transition:.15s;flex:0 0 auto}
.tbtn:hover{background:var(--card3)}
.tbtn svg{width:19px;height:19px;color:var(--text)}
.tbtn.acc{background:var(--acc);border-color:transparent}
.tbtn.acc svg{color:var(--acc-ink)}

/* ---------- tabs ---------- */
.tabs{max-width:960px;margin:0 auto;padding:0 16px;display:flex;gap:2px}
.tab{flex:1;padding:13px 6px 12px;font-size:14px;font-weight:600;color:var(--faint);
  border-bottom:2px solid transparent;transition:.15s;text-align:center}
.tab:hover{color:var(--dim)}
.tab.on{color:var(--text);border-bottom-color:var(--acc)}

/* ---------- search & filter row ---------- */
.bar{max-width:960px;margin:0 auto;padding:14px 16px 0;display:flex;gap:9px}
.sbox{flex:1;position:relative}
.sbox input{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;
  color:var(--text);font-family:inherit;font-size:15px;padding:12px 14px 12px 41px;outline:none}
.sbox input:focus{border-color:var(--acc)}
.sbox svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--faint)}
.fbtn{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 15px;
  font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;color:var(--dim);transition:.15s}
.fbtn:hover{color:var(--text)}
.fbtn svg{width:16px;height:16px}
.fbtn.on{background:var(--acc);color:var(--acc-ink);border-color:transparent}
.fbtn .cnt{background:var(--acc-ink);color:var(--acc);border-radius:20px;font-size:11px;padding:1px 7px;font-weight:700}

/* ---------- active filter strip ---------- */
.active-row{max-width:960px;margin:0 auto;padding:11px 16px 0;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.afilter{background:var(--acc);color:var(--acc-ink);border-radius:20px;font-size:12px;font-weight:700;
  padding:5px 8px 5px 12px;display:inline-flex;align-items:center;gap:6px}
.afilter b{opacity:.65;font-weight:700}
.aclear{color:var(--dim);font-size:12.5px;font-weight:600;text-decoration:underline;padding:5px 2px}

/* ---------- meta line ---------- */
.meta{max-width:960px;margin:0 auto;padding:14px 16px 0;display:flex;align-items:center;gap:10px}
.meta .count{font-size:12px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--faint);margin-right:auto}
.meta select{background:var(--card);border:1px solid var(--line);border-radius:10px;color:var(--dim);
  font-family:inherit;font-size:13px;font-weight:600;padding:8px 10px;outline:none;cursor:pointer}
.meta select:focus{border-color:var(--acc)}

main{max-width:960px;margin:0 auto;padding:14px 16px 100px}

/* ---------- leaderboard rows ---------- */
.lrow{display:flex;align-items:center;gap:13px;padding:12px 14px;background:var(--card);
  border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px;cursor:pointer;transition:.15s}
.lrow:hover{background:var(--card2);border-color:rgba(255,255,255,.14)}
.pos{width:28px;flex:0 0 auto;text-align:center;font-weight:700;font-size:15px;color:var(--faint)}
.lrow.p1 .pos{color:var(--gold)}.lrow.p2 .pos{color:var(--silver)}.lrow.p3 .pos{color:var(--bronze)}
.lrow.p1{border-color:rgba(255,197,61,.35)}
.linfo{flex:1;min-width:0}
.lbrand{font-size:10px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;color:var(--faint)}
.lname{font-size:15.5px;font-weight:700;letter-spacing:-.2px;line-height:1.25;margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lsub{font-size:11.5px;color:var(--faint);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lscore{flex:0 0 auto;text-align:right}
.lscore .v{font-size:20px;font-weight:700;line-height:1}
.lscore .m{font-size:10.5px;color:var(--faint);font-weight:500;margin-top:3px}

/* thumb */
.thumb{border-radius:8px;flex:0 0 auto;display:grid;place-items:center;font-weight:700;
  color:#101206;overflow:hidden;position:relative;line-height:1}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb.hasimg{cursor:zoom-in}
.thumb.hasimg .ini{display:none}

/* ---------- session cards ---------- */
.sess{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.sess-h{padding:15px 16px;display:flex;align-items:center;gap:13px;cursor:pointer;transition:.15s}
.sess-h:hover{background:var(--card2)}
.sess-i{flex:1;min-width:0}
.sess-d{font-size:10px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;color:var(--faint)}
.sess-t{font-size:16.5px;font-weight:700;letter-spacing:-.2px;margin:4px 0 7px;line-height:1.25}
.sess-m{display:flex;gap:6px;flex-wrap:wrap}
.tagx{font-size:10.5px;font-weight:600;padding:4px 9px;border-radius:20px;border:1px solid var(--line);color:var(--faint)}
.tagx.win{background:var(--acc);color:var(--acc-ink);border-color:transparent}
.tagx.warn{color:var(--bad);border-color:rgba(255,95,126,.35)}
.chev{width:19px;height:19px;color:var(--faint);transition:transform .22s;flex:0 0 auto}
.sess.open .chev{transform:rotate(180deg);color:var(--acc)}
.sess-b{display:none;border-top:1px solid var(--line);padding:4px 16px 10px}
.sess.open .sess-b{display:block}
.sess-b .lrow{background:transparent;border:none;border-bottom:1px solid var(--line);border-radius:0;
  margin:0;padding:13px 0}
.sess-b .lrow:last-child{border-bottom:none}
.sess-b .lrow:hover{background:transparent}
.sact{display:flex;gap:6px;padding:10px 0 4px;border-top:1px solid var(--line);margin-top:2px}
.sact button{font-size:12.5px;font-weight:600;color:var(--dim);padding:8px 12px;border-radius:9px;
  border:1px solid var(--line);display:inline-flex;align-items:center;gap:6px}
.sact button:hover{color:var(--text);background:var(--card2)}
.sact svg{width:14px;height:14px}
.gal{display:flex;gap:8px;flex-wrap:wrap;padding:12px 0 4px}
.gal img{width:74px;height:74px;object-fit:cover;border-radius:10px;cursor:zoom-in;border:1px solid var(--line)}

/* ---------- sheet (detail + filters + edit) ---------- */
.sheet-bg{position:fixed;inset:0;background:rgba(5,5,9,.72);backdrop-filter:blur(3px);z-index:60;
  display:none;align-items:flex-end;justify-content:center}
.sheet-bg.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92dvh;border-radius:20px 20px 0 0;
  display:flex;flex-direction:column;animation:up .22s ease}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.sheet-h{padding:16px 18px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);flex:0 0 auto}
.sheet-h h2{margin:0;font-size:16px;font-weight:700;flex:1;letter-spacing:-.2px;line-height:1.25}
.sheet-b{padding:18px;overflow:auto;flex:1;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
.sheet-f{padding:13px 18px;padding-bottom:calc(13px + env(safe-area-inset-bottom,0px));
  border-top:1px solid var(--line);display:flex;gap:10px;flex:0 0 auto}
.sheet-f button{flex:1;justify-content:center;height:48px;border-radius:12px;font-size:15px;font-weight:700;
  display:inline-flex;align-items:center;gap:8px}
.x{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--faint);flex:0 0 auto}
.x:hover{background:var(--card3);color:var(--text)}
.x svg{width:19px;height:19px}
.btn-a{background:var(--acc);color:var(--acc-ink)}
.btn-g{background:var(--card3);color:var(--text)}
.btn-a svg,.btn-g svg{width:17px;height:17px}

/* detail content */
.d-hero{display:flex;gap:14px;align-items:center;margin-bottom:16px}
.d-hero .di{flex:1;min-width:0}
.d-brand{font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--faint)}
.d-name{font-size:21px;font-weight:700;letter-spacing:-.4px;line-height:1.2;margin-top:3px}
.d-tot{text-align:right;flex:0 0 auto}
.d-tot .v{font-size:30px;font-weight:700;line-height:1}
.d-tot .m{font-size:11px;color:var(--faint);margin-top:3px}
.srow{margin-bottom:13px}
.srow-t{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.srow-t .lab{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--dim);flex:1}
.srow-t .who{font-size:12.5px;color:var(--faint);font-weight:600}
.srow-t .avg{font-size:15px;font-weight:700;min-width:34px;text-align:right}
.sbar{height:7px;border-radius:20px;background:var(--card3);overflow:hidden}
.sbar i{display:block;height:100%;border-radius:20px}
.d-tot-row{margin:18px 0 6px;padding-top:15px;border-top:1px solid var(--line)}
.d-txt{margin-top:18px}
.d-txt .blk{margin-bottom:13px}
.d-txt .blk h4{margin:0 0 4px;font-size:10.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--faint)}
.d-txt .blk p{margin:0;font-size:14.5px;color:var(--dim);line-height:1.6}
.d-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:16px}
.d-from{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--faint)}

/* filter sheet */
.fgroup{margin-bottom:20px}
.fgroup h3{margin:0 0 10px;font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--faint)}
.fchips{display:flex;gap:8px;flex-wrap:wrap}
.fchip{background:var(--card2);border:1px solid var(--line);border-radius:22px;padding:9px 14px;
  font-size:13.5px;font-weight:600;color:var(--dim);transition:.15s}
.fchip:hover{color:var(--text)}
.fchip.on{background:var(--acc);color:var(--acc-ink);border-color:transparent}
.fchip b{font-weight:700;margin-left:6px;opacity:.6}
.fmore{color:var(--acc);border-color:rgba(212,255,63,.35);background:transparent}

/* edit form */
label{display:block;font-size:10.5px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:var(--faint);margin:0 0 6px}
input[type=text],input[type=number],textarea,select.fld{width:100%;background:var(--card2);border:1px solid var(--line);
  border-radius:11px;color:var(--text);font-family:inherit;font-size:15px;padding:11px 13px;outline:none}
input:focus,textarea:focus,select.fld:focus{border-color:var(--acc)}
textarea{resize:vertical;min-height:46px}
.frow{display:flex;gap:11px;flex-wrap:wrap;margin-bottom:14px}
.frow>div{flex:1;min-width:130px}
.drow{background:var(--card2);border:1px solid var(--line);border-radius:13px;padding:14px;margin-bottom:11px}
.drow .dsub{font-size:10px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:var(--faint);margin:13px 0 6px}
.stbl{width:100%;border-collapse:collapse}
.stbl th{font-size:9.5px;letter-spacing:.9px;text-transform:uppercase;color:var(--faint);font-weight:700;padding:3px;text-align:center}
.stbl td{padding:3px}
.stbl td.lb{font-size:10px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--faint);white-space:nowrap;text-align:left}
.stbl input{text-align:center;padding:9px 2px;font-size:15px}
.irow{display:flex;gap:9px;align-items:center;margin-top:11px}
.irow input{flex:1}
.irow button{background:var(--card3);border-radius:10px;padding:11px 13px;font-size:13px;font-weight:600;white-space:nowrap}
.hint{font-size:11.5px;color:var(--faint);margin-top:8px}
.hint code{background:var(--card3);padding:2px 6px;border-radius:5px}
.dfoot{display:flex;gap:16px;align-items:center;margin-top:13px;flex-wrap:wrap}
.ck{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;text-transform:uppercase;
  letter-spacing:.4px;color:var(--text);cursor:pointer;margin:0}
.ck input{width:17px;height:17px;accent-color:var(--acc)}
.rmb{margin-left:auto;color:var(--bad);font-size:13px;font-weight:600;padding:7px 10px;border-radius:9px}
.rmb:hover{background:rgba(255,95,126,.1)}
.addb{width:100%;border:1px dashed rgba(212,255,63,.45);color:var(--acc);border-radius:12px;padding:13px;
  font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:4px}
.addb:hover{background:rgba(212,255,63,.07)}

/* misc */
.empty{text-align:center;padding:70px 20px;color:var(--faint)}
.empty .mark{width:56px;height:56px;margin:0 auto 16px;border-radius:16px}
.empty .mark svg{width:28px;height:28px}
.empty h2{color:var(--text);font-size:18px;margin:0 0 6px}
.empty p{margin:0;font-size:14px}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.94);display:none;align-items:center;justify-content:center;
  z-index:90;padding:18px;cursor:zoom-out}
.lightbox.show{display:flex}
.lightbox img{max-width:100%;max-height:100%;border-radius:12px}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(18px);
  background:var(--card3);border:1px solid var(--line);border-radius:22px;padding:12px 20px;font-size:13.5px;
  font-weight:600;opacity:0;transition:.25s;z-index:100;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
footer{max-width:960px;margin:0 auto;padding:0 16px 40px;text-align:center}
.fact{display:flex;gap:9px;justify-content:center;margin-bottom:14px}
.fact button{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:10px 15px;
  font-size:13px;font-weight:600;color:var(--dim);display:inline-flex;align-items:center;gap:7px}
.fact button:hover{color:var(--text)}
.fact svg{width:15px;height:15px}
footer p{margin:0;font-size:11.5px;color:var(--faint);letter-spacing:.4px}

/* ---------- data view ---------- */
.dsec{margin-bottom:26px}
.dsec h3{margin:0 0 4px;font-size:12px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--dim)}
.dsec .sub{margin:0 0 12px;font-size:12.5px;color:var(--faint)}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:9px;margin-bottom:14px}
.scard{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px 14px}
.scard .v{font-size:25px;font-weight:700;line-height:1}
.scard .l{font-size:10.5px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--faint);margin-top:6px}
.cmpbox{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:15px 16px}
.cmprow{margin-bottom:13px}
.cmprow:last-child{margin-bottom:0}
.cmprow .t{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.cmprow .t .n{font-size:12.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--dim);flex:1}
.cmprow .t .v{font-size:15px;font-weight:700}
.cmprow .t .x{font-size:11.5px;color:var(--faint)}
.insight{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--acc);
  border-radius:11px;padding:12px 14px;font-size:13.5px;color:var(--dim);margin-top:12px;line-height:1.6}
.insight b{color:var(--text)}
.seg{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.seg button{background:var(--card2);border:1px solid var(--line);border-radius:20px;padding:7px 13px;
  font-size:12.5px;font-weight:600;color:var(--faint)}
.seg button.on{background:var(--acc);color:var(--acc-ink);border-color:transparent}
.brow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
  border-radius:13px;padding:12px 14px;margin-bottom:8px;cursor:pointer;transition:.15s}
.brow:hover{background:var(--card2);border-color:rgba(255,255,255,.14)}
.bpos{width:22px;text-align:center;font-size:13px;font-weight:700;color:var(--faint);flex:0 0 auto}
.bmain{flex:1;min-width:0}
.bname{font-size:15px;font-weight:700;letter-spacing:-.1px}
.bmeta{font-size:11.5px;color:var(--faint);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bbars{display:flex;gap:4px;margin-top:7px}
.bbars span{height:5px;border-radius:20px;background:var(--card3);flex:1;overflow:hidden}
.bbars span i{display:block;height:100%;border-radius:20px}
.bval{flex:0 0 auto;text-align:right}
.bval .v{font-size:18px;font-weight:700;line-height:1}
.bval .l{font-size:10px;color:var(--faint);margin-top:3px}
.legend{display:flex;gap:12px;font-size:10.5px;color:var(--faint);margin:-2px 0 12px;flex-wrap:wrap}
.legend i{display:inline-block;width:9px;height:4px;border-radius:9px;margin-right:5px;vertical-align:middle}
.wgroup{margin-bottom:16px}
.wgroup h4{margin:0 0 8px;font-size:11px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;color:var(--faint)}
.wchips{display:flex;gap:7px;flex-wrap:wrap}
.wchip{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:7px 12px;
  font-size:13px;font-weight:600;color:var(--dim);transition:.15s}
.wchip:hover{color:var(--text);border-color:rgba(255,255,255,.18)}
.wchip b{color:var(--faint);font-weight:700;margin-left:6px;font-size:11px}

.jfbox{margin-top:18px;padding-top:16px;border-top:1px dashed rgba(255,255,255,.14)}
.jfbox .jfhead{font-size:10.5px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;color:var(--faint);margin-bottom:10px}
.jfperson{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:9px}
.jfperson .jt{display:flex;align-items:baseline;gap:9px;margin-bottom:6px}
.jfperson .jt b{font-size:13.5px;font-weight:700}
.jfperson .jt .sc{margin-left:auto;font-size:16px;font-weight:700;color:var(--acc)}
.jfperson .jt .sc small{font-size:10.5px;color:var(--faint);font-weight:500}
.jfperson p{margin:0;font-size:13.5px;color:var(--dim);line-height:1.55;font-style:italic}
.jfnote{font-size:12.5px;color:var(--faint);margin-top:6px}
.jfdot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--acc);margin-left:6px;vertical-align:middle}
.jfbtn{font-size:11px!important;opacity:.55;letter-spacing:1px}

function autoTags(d){

  if(/sugar.?free|no sugar|no added sugar|sokeriton|sokton|absolutely zero|zero sugar|ultra/.test(h))t.add("Sokeriton");

function testers(d){if(!d.s)return[];return TK.filter(tk=>CATS.some(([c])=>d.s[c]&&d.s[c][tk]!=null&&d.s[c][tk]!==""))}
function totalOf(d){if(d.s){let s=0;CATS.forEach(([c])=>TK.forEach(tk=>{const v=d.s[c]&&d.s[c][tk];if(v!=null&&v!=="")s+=+v}));return s}return d.total!=null?d.total:null}
function maxOf(d){return d.s?testers(d).length*15:30}
function pctOf(d){const t=totalOf(d);if(t==null)return null;const m=maxOf(d);return m?t/m:null}
function catAvg(v){const a=v.filter(x=>x!=null&&x!=="");if(!a.length)return null;return a.reduce((x,y)=>x+ +y,0)/a.length}
function r2(x){return Math.round(x*100)/100}
function fmt(n){return n==null?"–":(Number.isInteger(+n)?""+ +n:(+n).toFixed(2).replace(/\.?0+$/,'').replace('.',','))}
function col(p){if(p==null)return"var(--faint)";if(p<.4)return"var(--bad)";if(p<.6)return"var(--mid)";if(p<.77)return"var(--good)";return"var(--top)"}
function incomplete(d){return totalOf(d)==null||!!d.uncertain}
function catVal(d,c){if(!d.s)return null;const tl=testers(d);if(!tl.length)return null;
  return catAvg(tl.map(tk=>d.s[c]&&d.s[c][tk]))}

function wordCounts(list,field){
  const c={};
  list.forEach(({d})=>{
    let txt="";
    if(field==="maku")txt=(d.analyysi||"")+" "+(!d.s?(d.note||""):"");

  });

}

const AV=['#d4ff3f','#4be0c0','#ffc53d','#ff8fb0','#9db6ff','#7de08a','#ffab6b','#c9a6ff'];

function thumb(d,w){const h=Math.round(w*1.3),f=Math.round(w*.4);
  const c=d.img?[d.img]:[`ikonit/${slug(d.name)}.jpg`,`ikonit/${slug(d.name)}.png`];
  return `<span class="thumb" style="width:${w}px;height:${h}px;font-size:${f}px;background:${avc(getBrand(d))}" onclick="thumbTap(event,this)"><span class="ini">${esc(ini(d.name))}</span><img src="${escA(c[0])}" alt="" loading="lazy" data-alts="${escA(c.slice(1).join("|"))}" onload="this.parentNode.classList.add('hasimg')" onerror="icErr(this)"></span>`}

  if(a.length){i.setAttribute("data-alts",a.slice(1).join("|"));i.src=a[0]}else i.remove()}

function applyRenames(){

      if(BRAND_FIX[d.name] && d.brand!==BRAND_FIX[d.name]){d.brand=BRAND_FIX[d.name];changed=true}
    });
    if(s.winner && RENAME_FIX[s.winner]){s.winner=RENAME_FIX[s.winner];changed=true}
  });

/* bring in any brand-new tasting sessions added to SEED after someone already had local data saved */
function syncNewSessions(){
  const have=new Set(state.sessions.map(s=>s.title));
  let changed=false;
  SEED.forEach(seedS=>{
    if(!have.has(seedS.title)){
      state.sessions.push({id:uid(),...seedS,drinks:seedS.drinks.map(d=>({id:uid(),...d}))});
      changed=true;
    }
  });
  if(changed)save();
}

function init(){
  const st=load();
  if(st&&Array.isArray(st)&&st.length)state.sessions=st;
  else{state.sessions=SEED.map(s=>({id:uid(),...s,drinks:s.drinks.map(d=>({id:uid(),...d}))}));save()}
  applyRenames();
  syncNewSessions();
  applyJF();
  applyAliases();
  setView("top");
}

/* ========== filtering ========== */
const SPECIAL={__win__:"Voittajat",__inc__:"Puutteelliset"};
function filtered(){
  const q=$("#q").value.trim().toLowerCase();
  let a=allDrinks();
  if(selTags.length)a=a.filter(({d})=>{const u=unionTags(d);return selTags.every(t=>
    t==="__win__"?d.win : t==="__inc__"?incomplete(d) : u.has(t))});
  if(selBrands.length)a=a.filter(x=>selBrands.includes(getBrand(x.d)));
  if(q){
    const qt=q.split(/\s+/).filter(Boolean);
    a=a.filter(x=>{
      const hay=(x.d.name+" "+getBrand(x.d)+" "+(x.d.note||"")+" "+(x.d.analyysi||"")+" "+(x.d.haju||"")+" "+(x.d.un||"")+" "+(x.d.alias||[]).join(" ")+" "+x.s.title).toLowerCase();
      return qt.every(t=>hay.includes(t));
    });
  }
  return a;
}
function sortDrinks(a){
  const v=$("#sort").value;
  if(CATKEY[v]){
    a=a.filter(x=>catVal(x.d,CATKEY[v])!=null);
    a.sort((x,y)=>catVal(y.d,CATKEY[v])-catVal(x.d,CATKEY[v])||(pctOf(y.d)??-1)-(pctOf(x.d)??-1));
    return a;
  }
  if(v==="name")a.sort((x,y)=>x.d.name.localeCompare(y.d.name,'fi'));
  else if(v==="brand")a.sort((x,y)=>getBrand(x.d).localeCompare(getBrand(y.d),'fi')||(pctOf(y.d)??-1)-(pctOf(x.d)??-1));
  else if(v==="new")a.sort((x,y)=>dnum(y.s)-dnum(x.s));
  else a.sort((x,y)=>(pctOf(y.d)??-1)-(pctOf(x.d)??-1));
  return a;
}

const SORTS={
  top:[["score","Kokonaispisteet"],["maku","Parhaat makupisteet"],["haju","Parhaat hajupisteet"],["un","Paras ulkonäkö"],["name","Nimi A–Ö"],["brand","Brändi"]],
  drinks:[["score","Kokonaispisteet"],["maku","Parhaat makupisteet"],["haju","Parhaat hajupisteet"],["un","Paras ulkonäkö"],["name","Nimi A–Ö"],["brand","Brändi"],["new","Uusin testi"]],
  sessions:[["date","Uusin ensin"],["dateAsc","Vanhin ensin"],["best","Paras juoma"]],

};
function setView(v){
  view=v;
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t.dataset.v===v));
  const s=$("#sort");s.innerHTML=SORTS[v].map(([k,l])=>`<option value="${k}">${l}</option>`).join("");
  s.classList.toggle("hide",v==="data");
  $("#bFilter").classList.toggle("hide",v==="sessions");
  render();
}
function render(){
  renderActive();
  if(view==="sessions")renderSessions();
  else if(view==="data")renderData();
  else renderList();
}
function lrow(d,s,pos,metric){
  const t=totalOf(d),p=pctOf(d),c=col(p);
  const sub=view==="top"||view==="drinks"?`${esc(s.title)}${s.date?" · "+esc(s.date):""}`:"";
  let sc;
  if(metric){const v=catVal(d,metric.key);const mc=col(v==null?null:v/5);
    sc=`<div class="v num" style="color:${mc}">${v==null?"–":fmt(r2(v))}</div><div class="m num">${metric.lab} /5</div>`;}
  else sc=`<div class="v num" style="color:${c}">${t==null?"–":fmt(t)}</div><div class="m num">/${maxOf(d)}</div>`;
  return `<div class="lrow${pos&&pos<4?" p"+pos:""}" data-did="${d.id}" data-sid="${s.id}">
    ${pos?`<div class="pos num">${pos}</div>`:""}
    ${thumb(d,38)}
    <div class="linfo"><div class="lbrand">${esc(getBrand(d))}${d.win?" · ★":""}</div>
      <div class="lname">${esc(d.name)}</div>${sub?`<div class="lsub">${sub}</div>`:""}</div>
    <div class="lscore">${sc}</div>
  </div>`;
}

  const A={un:avg("un"),haju:avg("haju"),maku:avg("maku")};

    ${ranked[0][0]==="un"&&ranked[2][0]==="maku"?"Toisin sanoen tölkit näyttävät paremmalta kuin maistuvat.":""}</div>`;

  let h=`<section class="dsec"><h3>Yleiskuva</h3>

  /* --- testers --- */
  const tavg={};
  TK.forEach(tk=>{const o={};CATS.forEach(([c])=>{const v=a.map(x=>x.d.s&&x.d.s[c]&&x.d.s[c][tk]).filter(x=>x!=null&&x!=="");
    o[c]=v.length?v.reduce((p,q)=>p+ +q,0)/v.length:null;o[c+"_n"]=v.length});return tavg[tk]=o});
  const act=TK.filter(tk=>CATS.some(([c])=>tavg[tk][c]!=null));
  if(act.length){
    h+=`<section class="dsec"><h3>Testaajat</h3><p class="sub">Kuka antaa kovimmat pisteet?</p><div class="cmpbox">`;
    act.forEach(tk=>{
      const o=tavg[tk];
      const all=CATS.map(([c])=>o[c]).filter(x=>x!=null);
      const m=all.length?all.reduce((p,q)=>p+q,0)/all.length:null;
      h+=`<div class="cmprow"><div class="t"><span class="n">${TLAB[tk]}</span>
        <span class="x">UN ${o.un==null?"–":fmt(r2(o.un))} · Haju ${o.haju==null?"–":fmt(r2(o.haju))} · Maku ${o.maku==null?"–":fmt(r2(o.maku))}</span>

    });
    h+=`</div></section>`;
  }

  /* --- brands --- */
  const B={};
  a.forEach(({d,s})=>{const b=getBrand(d);(B[b]=B[b]||{n:0,pct:[],un:[],haju:[],maku:[],best:null,bestP:-1,wins:0});
    const o=B[b];o.n++;const p=pctOf(d);if(p!=null){o.pct.push(p);if(p>o.bestP){o.bestP=p;o.best=d}}
    if(d.win)o.wins++;
    CATS.forEach(([c])=>{const v=catVal(d,c);if(v!=null)o[c].push(v)})});

  else if(brandSort==="count")brands.sort((x,y)=>y.n-x.n||(y.pct??-1)-(x.pct??-1));

  brands.forEach((b,i)=>{
    const mb=(v,c)=>`<span><i style="width:${v==null?0:v/5*100}%;background:${c}"></i></span>`;
    h+=`<div class="brow" data-brand="${escA(b.name)}">
      <div class="bpos num">${i+1}</div>
      <div class="bmain"><div class="bname">${esc(b.name)}</div>
        <div class="bmeta">${b.n} juomaa${b.wins?` · ${b.wins}× voittaja`:""}${b.best?` · paras: ${esc(b.best.name)}`:""}</div>

      <div class="bval"><div class="v num" style="color:${col(b.pct)}">${b.pct==null?"–":Math.round(b.pct*100)+"%"}</div>
        <div class="l num">maku ${b.maku==null?"–":fmt(r2(b.maku))}</div></div></div>`;
  });
  h+=`</section>`;

  /* --- words --- */
  const W=[["un","Ulkonäkö"],["haju","Haju"],["maku","Maku & analyysi"]];
  h+=`<section class="dsec"><h3>Yleisimmät sanat</h3><p class="sub">Mitä sanoja käytätte eniten? Napauta hakeaksesi.</p>`;

    const c=wordCounts(a,k).slice(0,18);
    if(!c.length)return;

  $("#view").innerHTML=h;
  $("#view").querySelectorAll("[data-bs]").forEach(b=>b.addEventListener("click",()=>{brandSort=b.dataset.bs;renderData()}));
  $("#view").querySelectorAll("[data-brand]").forEach(b=>b.addEventListener("click",()=>{

  const bchip=b=>`<button class="fchip${selBrands.includes(b)?" on":""}" data-b="${escA(b)}">${esc(b)}<b>${counts[b]}</b></button>`;
  $("#fBody").innerHTML=`
    <div class="fgroup"><h3>Erikoislistat</h3><div class="fchips">
      ${chip("__win__","★ Voittajat",selTags.includes("__win__"))}
      ${chip("__inc__","Puutteelliset",selTags.includes("__inc__"))}
    </div></div>
    <div class="fgroup"><h3>Ominaisuus</h3><div class="fchips">
      ${PROP_TAGS.map(t=>chip(t,t,selTags.includes(t))).join("")}
    </div></div>
    <div class="fgroup"><h3>Makutyyppi</h3><div class="fchips">
      ${FLAVOR_TAGS.map(t=>chip(t,t,selTags.includes(t))).join("")}
    </div></div>
    <div class="fgroup"><h3>Brändi</h3><div class="fchips">
      ${shown.map(bchip).join("")}
      ${brands.length>shown.length?`<button class="fchip fmore" id="fMore">+${brands.length-shown.length} lisää</button>`:
        (brandsOpen&&brands.length>BRAND_SHOW?`<button class="fchip fmore" id="fLess">Näytä vähemmän</button>`:"")}
    </div></div>`;
  $("#fBody").querySelectorAll("[data-k]").forEach(b=>b.addEventListener("click",()=>{
    const k=b.dataset.k,i=selTags.indexOf(k);i>=0?selTags.splice(i,1):selTags.push(k);
    renderFilterSheet();render()}));
  $("#fBody").querySelectorAll("[data-b]").forEach(b=>b.addEventListener("click",()=>{
    const k=b.dataset.b,i=selBrands.indexOf(k);i>=0?selBrands.splice(i,1):selBrands.push(k);
    renderFilterSheet();render()}));
  const mo=$("#fMore");if(mo)mo.addEventListener("click",()=>{brandsOpen=true;renderFilterSheet()});
  const le=$("#fLess");if(le)le.addEventListener("click",()=>{brandsOpen=false;renderFilterSheet()});
}

/* ========== detail sheet ========== */
function openDetail(d,s){
  const t=totalOf(d),mx=maxOf(d),p=pctOf(d),c=col(p),tl=testers(d);
  $("#dTitle").textContent=d.name;
  let h=`<div class="d-hero">${thumb(d,54)}<div class="di">
      <div class="d-brand">${esc(getBrand(d))}${d.win?" · ★ voittaja":""}</div>
      <div class="d-name">${esc(d.name)}</div></div>
    <div class="d-tot"><div class="v num" style="color:${c}">${t==null?"–":fmt(t)}</div><div class="m num">/ ${mx}</div></div></div>`;
  if(tl.length){
    h+=`<div>`;
    CATS.forEach(([k,lab])=>{
      const vals=tl.map(tk=>d.s[k]&&d.s[k][tk]);
      const a=catAvg(vals);
      const who=tl.map((tk,i)=>`${TLAB[tk]} ${vals[i]==null||vals[i]===""?"–":fmt(vals[i])}`).join(" · ");
      h+=`<div class="srow"><div class="srow-t"><span class="lab">${lab}</span><span class="who num">${who}</span>
        <span class="avg num" style="color:${col(a==null?null:a/5)}">${a==null?"–":fmt(r2(a))}</span></div>
        <div class="sbar"><i style="width:${a==null?0:Math.max(3,a/5*100)}%;background:${col(a==null?null:a/5)}"></i></div></div>`;
    });
    h+=`</div>`;
  }
  h+=`<div class="d-tot-row"><div class="srow-t"><span class="lab">Kokonaispisteet</span>
      <span class="avg num" style="color:${c}">${t==null?"–":fmt(t)} / ${mx}</span></div>
      <div class="sbar"><i style="width:${p==null?0:Math.max(3,p*100)}%;background:${c}"></i></div></div>`;
  const blocks=[];
  if(d.un)blocks.push(["Ulkonäkö",d.un]);
  if(d.haju)blocks.push(["Haju",d.haju]);
  if(d.analyysi)blocks.push(["Analyysi",d.analyysi]);
  if(!d.s&&!d.analyysi&&d.note)blocks.push(["Analyysi",d.note]);
  if(blocks.length)h+=`<div class="d-txt">${blocks.map(([l,v])=>`<div class="blk"><h4>${l}</h4><p>${esc(v)}</p></div>`).join("")}</div>`;
  const tg=[...unionTags(d)];
  if(tg.length||d.uncertain)h+=`<div class="d-tags">${tg.map(x=>`<span class="tagx">${esc(x)}</span>`).join("")}${d.uncertain?'<span class="tagx warn">tarkista</span>':""}</div>`;
  h+=`<div class="d-from">Testistä: <b>${esc(s.title)}</b>${s.date?" · "+esc(s.date):""}</div>`;
  if(jfOn&&d.jf){
    const jp=(name,p)=>p?`<div class="jfperson"><div class="jt"><b>${esc(name)}</b><span class="sc num">${p.score}<small>/100</small></span></div>${p.text?`<p>${esc(p.text)}</p>`:""}</div>`:"";
    h+=`<div class="jfbox"><div class="jfhead">🤫 Iha Just Imus -raati</div>
      ${jp("Konsta",d.jf.konsta)}${jp("Olli",d.jf.olli)}
      ${d.jf.note?`<div class="jfnote">${esc(d.jf.note)}</div>`:""}</div>`;
  }
  $("#dBody").innerHTML=h;
  $("#dFoot").innerHTML=`<button class="btn-g" id="dEdit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>Muokkaa</button>
    <button class="btn-a" data-close="dBg">Sulje</button>`;
  $("#dEdit").addEventListener("click",()=>{$("#dBg").classList.remove("show");openEdit(s.id)});
  $("#dFoot").querySelector("[data-close]").addEventListener("click",()=>$("#dBg").classList.remove("show"));
  $("#dBg").classList.add("show");
}
function showRandom(){const a=allDrinks();if(!a.length)return;const p=a[Math.floor(Math.random()*a.length)];
  openDetail(p.d,p.s);$("#dTitle").textContent="🎲 "+p.d.name}

/* ========== edit sheet ========== */
function blank(){return{id:uid(),name:"",brand:"",un:"",haju:"",analyysi:"",win:false,img:"",tags:[],s:{un:{},haju:{},maku:{}}}}
function openEdit(id){
  editId=id||null;
  const s=id?state.sessions.find(x=>x.id===id):null;
  $("#eTitle").textContent=id?"Muokkaa testiä":"Lisää testi";
  $("#eT").value=s?s.title:"";$("#eD").value=s?s.date:"";$("#eW").value=s?s.winner:"";
  $("#eK").value=s&&s.kuvat?s.kuvat.join(", "):"";
  const w=$("#eDrinks");w.innerHTML="";
  (s?s.drinks:[blank()]).forEach(d=>w.appendChild(drinkRow(d)));
  $("#eBg").classList.add("show");
}
function sIn(c,v){return `<input class="${c}" type="number" min="0" max="5" step="0.25" inputmode="decimal" placeholder="–" value="${v==null||v===""?"":v}">`}
function drinkRow(d){
  const s=d.s||{un:{},haju:{},maku:{}},g=(c,t)=>s[c]&&s[c][t];
  const an=d.analyysi||(!d.s&&d.note?d.note:"")||d.note||"";
  const r=document.createElement("div");r.className="drow";
  r.innerHTML=`
    <input type="text" class="d-n" placeholder="Juoman nimi" value="${escA(d.name)}">
    <div class="frow" style="margin:9px 0 0"><div><label>Brändi</label><input type="text" class="d-b" value="${escA(d.brand||brandFromName(d.name))}"></div></div>
    <div class="frow" style="margin:11px 0 0">
      <div><label>Ulkonäkö</label><textarea class="d-u">${esc(d.un||"")}</textarea></div>
      <div><label>Haju</label><textarea class="d-h">${esc(d.haju||"")}</textarea></div>
    </div>
    <div style="margin-top:11px"><label>Analyysi / maku</label><textarea class="d-a">${esc(an)}</textarea></div>
    <div class="dsub">Pisteet 0–5</div>
    <table class="stbl"><tr><th></th><th>Tipi</th><th>Tomi</th><th>Visa</th></tr>
      <tr><td class="lb">Ulkonäkö</td><td>${sIn("u-t",g("un","tipi"))}</td><td>${sIn("u-o",g("un","tomi"))}</td><td>${sIn("u-v",g("un","visa"))}</td></tr>
      <tr><td class="lb">Haju</td><td>${sIn("h-t",g("haju","tipi"))}</td><td>${sIn("h-o",g("haju","tomi"))}</td><td>${sIn("h-v",g("haju","visa"))}</td></tr>
      <tr><td class="lb">Maku</td><td>${sIn("m-t",g("maku","tipi"))}</td><td>${sIn("m-o",g("maku","tomi"))}</td><td>${sIn("m-v",g("maku","visa"))}</td></tr>
    </table>
    <div class="dsub">Tagit</div>
    <div class="fchips">${ALL_TAGS.map(t=>`<button type="button" class="fchip${(d.tags||[]).includes(t)?" on":""}" data-t="${escA(t)}">${esc(t)}</button>`).join("")}</div>
    <div class="irow"><input type="text" class="d-img" placeholder="Kuvan URL (valinnainen)" value="${escA(d.img||"")}">
      <button type="button" class="d-up">Lataa</button><input type="file" class="d-file" accept="image/*" hidden></div>
    <div class="hint">Kuvake haetaan automaattisesti: <code class="d-path"></code></div>
    <div class="dfoot"><label class="ck"><input type="checkbox" class="d-w" ${d.win?"checked":""}> Voittaja</label>
      <label class="ck"><input type="checkbox" class="d-unc" ${d.uncertain?"checked":""}> Tarkista</label>
      <button type="button" class="rmb">Poista</button></div>`;
  r.querySelectorAll("[data-t]").forEach(b=>b.addEventListener("click",()=>b.classList.toggle("on")));
  r.querySelector(".rmb").addEventListener("click",()=>r.remove());
  const nm=r.querySelector(".d-n"),br=r.querySelector(".d-b"),im=r.querySelector(".d-img"),
        up=r.querySelector(".d-up"),fi=r.querySelector(".d-file"),pa=r.querySelector(".d-path");
  const upd=()=>{pa.textContent="ikonit/"+slug(nm.value)+".jpg"};
  nm.addEventListener("input",()=>{if(!br.value.trim())br.value=brandFromName(nm.value);upd()});
  up.addEventListener("click",()=>fi.click());
  fi.addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;crop(f,180,u=>{if(u){im.value=u;toast("Kuva lisätty")}});e.target.value=""});
  upd();
  return r;
}
function crop(file,size,cb){const fr=new FileReader();fr.onload=()=>{const im=new Image();
  im.onload=()=>{const s=Math.min(im.width,im.height),c=document.createElement('canvas');
    c.width=c.height=size;c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,size,size);
    cb(c.toDataURL('image/jpeg',.82))};im.onerror=()=>cb(null);im.src=fr.result};fr.readAsDataURL(file)}
function readEdit(){
  const rows=[...$("#eDrinks").querySelectorAll(".drow")];
  const drinks=rows.map(r=>{
    const n=sel=>{const v=r.querySelector(sel).value.trim();return v===""?undefined:parseFloat(v.replace(',','.'))};
    const cell=m=>{const o={};TK.forEach((tk,i)=>{const v=n(m[i]);if(v!==undefined&&!isNaN(v))o[tk]=v});return o};
    const sc={un:cell([".u-t",".u-o",".u-v"]),haju:cell([".h-t",".h-o",".h-v"]),maku:cell([".m-t",".m-o",".m-v"])};
    const has=CATS.some(([c])=>Object.keys(sc[c]).length);
    const o={id:uid(),name:r.querySelector(".d-n").value.trim(),brand:r.querySelector(".d-b").value.trim(),
      un:r.querySelector(".d-u").value.trim(),haju:r.querySelector(".d-h").value.trim(),
      analyysi:r.querySelector(".d-a").value.trim(),win:r.querySelector(".d-w").checked,
      uncertain:r.querySelector(".d-unc").checked,tags:[...r.querySelectorAll("[data-t].on")].map(x=>x.dataset.t)};
    const img=r.querySelector(".d-img").value.trim();if(img)o.img=img;
    if(has)o.s=sc;
    return o;
  }).filter(d=>d.name);
  return{title:$("#eT").value.trim()||"Testi",date:$("#eD").value.trim(),winner:$("#eW").value.trim(),
    kuvat:$("#eK").value.split(",").map(x=>x.trim()).filter(Boolean),drinks};
}
function saveEdit(){
  const d=readEdit();
  if(!d.drinks.length){toast("Lisää vähintään yksi juoma");return}
  if(editId)Object.assign(state.sessions.find(x=>x.id===editId),d);
  else state.sessions.unshift({id:uid(),...d});
  save();$("#eBg").classList.remove("show");render();toast(editId?"Tallennettu":"Testi lisätty");editId=null;
}

/* ========== io ========== */
function exportJSON(){const b=new Blob([JSON.stringify(state.sessions,null,2)],{type:"application/json"});
  const u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download="energialabra-data.json";a.click();
  URL.revokeObjectURL(u);toast("JSON ladattu")}
function importJSON(f){const r=new FileReader();r.onload=()=>{try{
  const d=JSON.parse(r.result);if(!Array.isArray(d))throw 0;
  const n=d.map(s=>({id:s.id||uid(),title:s.title||"Testi",date:s.date||"",winner:s.winner||"",note:s.note||"",
    kuvat:s.kuvat||[],drinks:(s.drinks||[]).map(x=>({id:x.id||uid(),...x}))}));
  state.sessions=confirm("Korvataanko nykyinen data? (Peruuta = yhdistä loppuun)")?n:state.sessions.concat(n);
  save();render();toast("Tuonti onnistui")}catch(e){toast("Virhe: tiedosto ei kelpaa")}};r.readAsText(f)}
let tt;function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),2100)}
function showInfo(){
  $("#dTitle").textContent="Näin pisteet lasketaan";
  $("#dBody").innerHTML=`<div class="d-txt">
    <div class="blk"><h4>Kategoriat</h4><p>Jokainen juoma arvioidaan kolmessa kategoriassa: ulkonäkö, haju ja maku. Asteikko on 0–5 per testaaja.</p></div>
    <div class="blk"><h4>Kokonaispisteet</h4><p>Kaikkien pisteiden summa. Kahdella testaajalla maksimi on 30, kolmella 45. Kärkilista vertailee prosentteina, joten erikokoiset testit ovat keskenään reiluja.</p></div>
    <div class="blk"><h4>Värit</h4><p>Pisteen väri kertoo tason: punainen heikko, oranssi ok, vihreä hyvä, turkoosi huippu.</p></div>
    <div class="blk"><h4>Puutteelliset</h4><p>Osa vanhoista vihkosivuista oli vaikealukuisia. Ne on merkitty "tarkista", ja löydät ne suodattimesta kohdasta Puutteelliset.</p></div>
    <div class="blk"><h4>Kuvat</h4><p>Juoman kuvake haetaan <code>ikonit/</code>-kansiosta juoman nimellä, testikuvat <code>kuvat/</code>-kansiosta. Klikkaa kuvaa suurentaaksesi.</p></div></div>`;
  $("#dFoot").innerHTML=`<button class="btn-a" id="iOk">Selvä</button>`;
  $("#iOk").addEventListener("click",()=>$("#dBg").classList.remove("show"));
  $("#dBg").classList.add("show");
}

/* ========== events ========== */
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>setView(t.dataset.v)));
$("#q").addEventListener("input",render);
$("#sort").addEventListener("change",render);
$("#bFilter").addEventListener("click",openFilters);
$("#fClear").addEventListener("click",()=>{selTags=[];selBrands=[];renderFilterSheet();render()});
$("#bRandom").addEventListener("click",showRandom);
$("#bAdd").addEventListener("click",()=>openEdit(null));
$("#eAdd").addEventListener("click",()=>$("#eDrinks").appendChild(drinkRow(blank())));
$("#eSave").addEventListener("click",saveEdit);
$("#bExport").addEventListener("click",exportJSON);
$("#bImport").addEventListener("click",()=>$("#file").click());
$("#bInfo").addEventListener("click",showInfo);
$("#bJF").addEventListener("click",()=>{
  jfOn=!jfOn;try{localStorage.setItem("jf_on",jfOn?"1":"0")}catch(e){}
  $("#bJF").classList.toggle("on",jfOn);
  toast(jfOn?"JF-raati näkyvissä":"JF-raati piilotettu");
});
if(jfOn)$("#bJF").classList.add("on");
$("#file").addEventListener("change",e=>{if(e.target.files[0])importJSON(e.target.files[0]);e.target.value=""});
$("#lb").addEventListener("click",()=>$("#lb").classList.remove("show"));
document.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",()=>$("#"+b.dataset.close).classList.remove("show")));
document.querySelectorAll(".sheet-bg").forEach(b=>b.addEventListener("click",e=>{if(e.target===b)b.classList.remove("show")}));
document.addEventListener("keydown",e=>{if(e.key==="Escape")document.querySelectorAll(".sheet-bg.show,.lightbox.show").forEach(x=>x.classList.remove("show"))});

init();
</script>
</body>
</html>
